name: CI

# One workflow for everything: the static gates, the Rocq build and the axiom
# audit, the blueprint (web + pdf), the coqdoc API documentation, and the Pages
# deploy of https://formal-dynamics.github.io/rocq-dynamics/ .
#
# This used to be two workflows, build.yml (the gate) and blueprint.yml (the
# site). Both installed the same pinned opam switch and compiled the whole
# development, so every push paid ~30 min of identical work twice, in parallel.
# Here the development is built exactly once, in `build`, and `assemble` glues
# its coqdoc output to the blueprint.
#
# Caching (shared by nothing else now, but still worth its keys):
#  - opam: scripts/ci_install_deps.sh owns the package list and tars the
#    container's opam root into the workspace; the cache is keyed on that
#    script, so the key and the packages cannot drift apart.
#  - build products: what makes reuse SOUND is scripts/ci_vo_cache.sh, which
#    deletes the .vo of every source whose sha256 moved, so make cannot skip a
#    file that really changed (timestamps alone cannot decide this: a commit
#    authored before the previous run finished is older than the .vo that run
#    cached). What makes reuse EFFECTIVE is git-restore-mtime: a fresh checkout
#    stamps every .v with the checkout time, which would make the surviving
#    .vo look stale and rebuild everything anyway.
#
# Bump CACHE_TAG together with COQ_IMAGE (cache keys cannot interpolate an
# image name containing "/" and ":" cleanly).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # MathComp 2.5.0 on Rocq 9.1 (tag used by LLM4Rocq/digraph-theory CI).
  COQ_IMAGE: 'mathcomp/mathcomp:2.5.0-rocq-prover-9.1'
  CACHE_TAG: 'mc2.5.0-rocq9.1'

jobs:
  # Seconds, and independent of everything else: report a layering or Admitted
  # mistake immediately instead of after the blueprint and the build.
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the import layering
        run: python3 scripts/check_layers.py
      - name: No Admitted / admit / Axiom in theories
        run: python3 scripts/check_admitted.py

  blueprint:
    name: Build the blueprint (web + pdf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the blueprint
        uses: xu-cheng/texlive-action@v2
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250401
          run: |
            set -eu
            apk update
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            python3 -m venv env
            . env/bin/activate
            pip install --upgrade pip requests wheel
            pip install pygraphviz \
              --config-settings="--global-option=build_ext" \
              --config-settings="--global-option=-L/usr/lib/graphviz/" \
              --config-settings="--global-option=-R/usr/lib/graphviz/"
            pip install rocqblueprint
            rocqblueprint pdf
            rocqblueprint web
            mkdir -p site
            cp blueprint/print/print.pdf site/blueprint.pdf
            cp -r blueprint/web site/blueprint
      - name: Take ownership of container-created files
        run: sudo chown -R "$(id -u):$(id -g)" blueprint site
      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-site
          path: site
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rocq-decls
          path: blueprint/rocq_decls
          if-no-files-found: error

  # The single Rocq build: gate (axiom audit), declaration check and coqdoc all
  # come off it. It needs `blueprint` only for the rocq_decls list to check.
  build:
    name: Build, audit the axioms, and build the documentation
    needs: [gates, blueprint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # git-restore-mtime walks the history to date each file.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rocq-decls
          path: blueprint
      - name: Restore the source timestamps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-restore-mtime
          git restore-mtime
      - name: Cache the opam dependencies
        uses: actions/cache@v4
        with:
          path: .ci-opam.tar
          key: opam-${{ env.CACHE_TAG }}-${{ hashFiles('scripts/ci_install_deps.sh') }}
      - name: Cache the build products
        uses: actions/cache@v4
        with:
          path: |
            theories/**/*.vo
            theories/**/*.vok
            theories/**/*.vos
            theories/**/*.glob
            .ci-vo-manifest.sha256
          key: vo-${{ env.CACHE_TAG }}-${{ hashFiles('scripts/ci_install_deps.sh') }}-${{ hashFiles('theories/**/*.v', '_CoqProject') }}
          restore-keys: |
            vo-${{ env.CACHE_TAG }}-${{ hashFiles('scripts/ci_install_deps.sh') }}-
      - name: Drop the cached build products of edited sources
        run: bash scripts/ci_vo_cache.sh prune
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: ${{ env.COQ_IMAGE }}
          # The chown must happen before `install`, which writes the opam
          # tarball into the workspace.
          before_install: |
            startGroup "Workaround permission issue"
              sudo chown -R "$(id -u):$(id -g)" .
            endGroup
          install: |
            startGroup "Install dependencies"
              bash scripts/ci_install_deps.sh
            endGroup
          before_script: |
            startGroup "Mark the surviving build products as current"
              bash scripts/ci_vo_cache.sh touch
            endGroup
          script: |
            startGroup "Build"
              make -j2
            endGroup
            startGroup "Axiom audit"
              ./verify.sh --no-clean
            endGroup
            startGroup "Check the declarations cited by the blueprint"
              python3 scripts/check_rocq_decls.py blueprint/rocq_decls
            endGroup
            startGroup "coqdoc"
              make -f CoqMakefile gallinahtml
            endGroup
          after_script: |
            startGroup "Restore permissions"
              sudo chown -R 1001:116 . || true
            endGroup
      - name: Record the source hashes for the next run
        # Also on failure: the cache is saved either way, and the manifest has
        # to keep describing the sources the cached .vo were built from.
        if: always()
        run: bash scripts/ci_vo_cache.sh record
      - name: Collect coqdoc
        run: |
          sudo chown -R "$(id -u):$(id -g)" html
          # coqdoc puts the A-Z index of identifiers in indexpage.html
          # (CoqMakefile.local), so <site>/docs/ can land on the table of
          # contents -- the list of modules and their statements.
          cp html/toc.html html/index.html
          mkdir -p site && mv html site/docs
      - uses: actions/upload-artifact@v4
        with:
          name: coqdoc-site
          path: site
          if-no-files-found: error

  assemble:
    name: Assemble the site
    needs: [blueprint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: blueprint-site
          path: home_page
      - uses: actions/download-artifact@v4
        with:
          name: coqdoc-site
          path: home_page
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: home_page
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build the website using Jekyll
        working-directory: home_page
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Check every piece made it into the site
        working-directory: home_page
        run: |
          test -f _site/index.html
          test -f _site/blueprint/index.html
          test -f _site/blueprint.pdf
          test -f _site/docs/toc.html
          test -f _site/docs/index.html
          test -f _site/docs/indexpage.html
          # The project site lives under /rocq-dynamics/, so a link emitted at
          # the domain root is broken (this is how the Blueprint link on the
          # home page broke: an empty baseurl made relative_url drop the
          # repository path).
          ! grep -qE 'href="/(blueprint|docs)' _site/index.html
          grep -q 'href="/rocq-dynamics/blueprint/"' _site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: home_page/_site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: home_page/_site

  deploy:
    name: Deploy to GitHub Pages (best effort)
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
