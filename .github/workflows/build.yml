name: Build

# Gating CI: cheap static gates first, then a full Rocq build and the axiom
# audit (verify.sh) inside the MathComp Docker image the LLM4Rocq projects use.
#
# Caching. This workflow and blueprint.yml need the same pinned opam switch and
# the same .vo files, and neither is cheap: compiling mathcomp-analysis from
# source dominates the ~30 min each job used to take. Two caches:
#
#  - opam: scripts/ci_install_deps.sh tars the container's opam root into the
#    workspace, keyed on that script (the package list lives there, so the key
#    and the packages cannot drift apart) plus the base image.
#  - build products: what makes reuse SOUND is scripts/ci_vo_cache.sh, which
#    deletes the .vo of every source whose sha256 moved, so make cannot skip a
#    file that really changed (timestamps alone cannot decide this: a commit
#    authored before the previous run finished is older than the .vo that run
#    cached). What makes reuse EFFECTIVE is git-restore-mtime: a fresh checkout
#    stamps every .v with the checkout time, which would make the surviving
#    .vo look stale and rebuild everything anyway.
#
# Bump CACHE_TAG together with COQ_IMAGE (cache keys cannot interpolate an
# image name containing "/" and ":" cleanly).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # MathComp 2.5.0 on Rocq 9.1 (tag used by LLM4Rocq/digraph-theory CI).
  COQ_IMAGE: 'mathcomp/mathcomp:2.5.0-rocq-prover-9.1'
  CACHE_TAG: 'mc2.5.0-rocq9.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # git-restore-mtime walks the history to date each file.
          fetch-depth: 0

      - name: Check the import layering
        run: python3 scripts/check_layers.py

      - name: No Admitted / admit / Axiom in theories
        run: python3 scripts/check_admitted.py

      - name: Restore the source timestamps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-restore-mtime
          git restore-mtime

      - name: Cache the opam dependencies
        uses: actions/cache@v4
        with:
          path: .ci-opam.tar
          key: opam-${{ env.CACHE_TAG }}-${{ hashFiles('scripts/ci_install_deps.sh') }}

      - name: Cache the build products
        uses: actions/cache@v4
        with:
          path: |
            theories/**/*.vo
            theories/**/*.vok
            theories/**/*.vos
            theories/**/*.glob
            .ci-vo-manifest.sha256
          key: vo-${{ env.CACHE_TAG }}-${{ hashFiles('scripts/ci_install_deps.sh') }}-${{ hashFiles('theories/**/*.v', '_CoqProject') }}
          restore-keys: |
            vo-${{ env.CACHE_TAG }}-${{ hashFiles('scripts/ci_install_deps.sh') }}-

      - name: Drop the cached build products of edited sources
        run: bash scripts/ci_vo_cache.sh prune

      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: ${{ env.COQ_IMAGE }}
          # The chown must happen before `install`, which writes the opam
          # tarball into the workspace.
          before_install: |
            startGroup "Workaround permission issue"
              sudo chown -R "$(id -u):$(id -g)" .
            endGroup
          install: |
            startGroup "Install dependencies"
              bash scripts/ci_install_deps.sh
            endGroup
          script: |
            startGroup "Build"
              make -j2
            endGroup
            startGroup "Axiom audit"
              ./verify.sh --no-clean
            endGroup
          after_script: |
            startGroup "Restore permissions"
              sudo chown -R 1001:116 . || true
            endGroup

      - name: Record the source hashes for the next run
        # Also on failure: the cache is saved either way, and the manifest has
        # to keep describing the sources the cached .vo were built from.
        if: always()
        run: bash scripts/ci_vo_cache.sh record
